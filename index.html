<h2>Wir <strong>programmieren</strong>gerne.</h2>
    
    <!-- Uhren -->
    <div id="uhrDeutschland" class="uhr"></div>
    <div id="uhrJapan" class="uhr"></div>
    <div id="uhrAustralien" class="uhr"></div>

    <script>
        function updateUhren() {
            const jetzt = new Date();

            const optionen = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            };

            // Deutschland
            const deutschland = jetzt.toLocaleString("de-DE", {
                ...optionen,
                timeZone: "Europe/Berlin"
            });

            // Japan
            const japan = jetzt.toLocaleString("de-DE", {
                ...optionen,
                timeZone: "Asia/Tokyo"
            });

            // Australien (Sydney)
            const australien = jetzt.toLocaleString("de-DE", {
                ...optionen,
                timeZone: "Australia/Sydney"
            });

            document.getElementById("uhrDeutschland").innerHTML =
                "🇩🇪 Deutschland: " + deutschland;

            document.getElementById("uhrJapan").innerHTML =
                "🇯🇵 Japan: " + japan;

            document.getElementById("uhrAustralien").innerHTML =
                "🇦🇺 Australien: " + australien;
        }

        // Sofort anzeigen
        updateUhren();

        // Jede Sekunde aktualisieren
        setInterval(updateUhren, 1000);
    </script>

</body>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Passwort</title>

    <style>
      body {
        background-color: lightblue;
        padding: 30px;
        font-family: Arial, sans-serif;
      }

      button {
        margin-top: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
    </style>

    <script>
        function checkPasswort() {
            var passwortFeld = document.getElementById("passwortFeld");
            var passwortText = passwortFeld.value.trim();

            if(passwortText === "programmieren") {

                // Weiterleitung
                window.location.href = "https://jobo899.github.io/j/";

                return false;
            }
            else {
                alert("Zugriff verweigert! Passwort falsch!");
                passwortFeld.value = "";
                return false;
            }
        }

        function passwortAnzeigen() {
            var feld = document.getElementById("passwortFeld");

            if (feld.type === "password") {
                feld.type = "text";
            } else {
                feld.type = "password";
            }
        }
    </script>
</head>

<body>

    <p style="font-size: 30pt;">🔐</p>

    <p>Bitte gib das Passwort für diese Seite ein.</p>

    <p>
        Passwort:
        <input id="passwortFeld" type="password" autocomplete="off"/>
    </p>

    <button onclick="passwortAnzeigen()">
        Passwort anzeigen
    </button>

    <br><br>

    <button onclick="checkPasswort()">
        Einloggen
    </button>

    <br><br>

    <p>Finde den Code raus! Wir haben die Rätsel auf den Seiten versteckt.</p>

    <br>

    <h3>Viel Glück!</h3>

</body>
</html>
